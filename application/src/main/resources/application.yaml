spring:
  application:
    name: coffee-kitty
  autoconfigure:
    # SecurityConfig authenticates with ActingUserAuthenticationFilter and needs no user store of Spring Security. With
    # the default user store, Spring Boot would log a generated password on every start.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Removes the values of the affected row, such as an email address, from the message of a database error. The
        # message still names the violated constraint.
        logServerErrorDetail: false
  jpa:
    # Turns off Open Session in View, which holds a database connection for the whole request. Without Open Session
    # in View, a lazy association can load only inside a transaction. No JPA entity has a lazy association yet. The
    # read methods of CrudDataServiceImpl and of the data adapters, except getByUserIdForUpdate, are not
    # @Transactional. When the caller has no transaction, these methods map the JPA entity outside any transaction. A
    # data adapter for a JPA entity with a lazy association must therefore read and map the entity inside a
    # @Transactional method.
    open-in-view: false
    hibernate:
      # Flyway creates and migrates the schema. Hibernate checks at startup that the JPA entities match the schema
      # and does not change the schema.
      ddl-auto: validate
    properties:
      # Stops Hibernate from logging SQL errors. The exception handler already logs each database error that a request
      # causes, and Hibernate would log the same error a second time.
      hibernate.jdbc.log.errors: false
  jackson:
    # With the settings below, Jackson rejects a value in a request body when its JSON type differs from the type of
    # the field. By default, Jackson converts the value. JsonConfig in the api module adds the setting for String
    # fields, for which Spring Boot has no property.
    mapper:
      # Jackson rejects a JSON string for a number or a boolean field, and the request gets a 400. With the default
      # true, Jackson would read a delta of "1" as 1, and the request would add a coffee.
      allow-coercion-of-scalars: false
    deserialization:
      # Jackson rejects a request body with a field that the DTO does not have, and the request gets a 400. With the
      # default false, Jackson would ignore the field: POST /api/users would accept a body with an id or with a
      # misspelled optional field, such as "rol", and create the user without it.
      fail-on-unknown-properties: true
      # Jackson rejects a JSON number with a fraction for an integer field, and the request gets a 400. With the
      # default true, Jackson would truncate a delta of 1.9 to 1, and the request would add a coffee.
      accept-float-as-int: false
    datatype:
      enum:
        # Jackson rejects a JSON number for an enum field, and the request gets a 400. With the default false,
        # Jackson would read a role of 1 as ADMIN, the constant of Role with the index 1.
        fail-on-numbers-for-enums: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# Custom properties. The KDoc of a @ConfigurationProperties class documents the keys under its prefix. For
# campus-coffee.bootstrap-admin, this class is BootstrapAdminProperties.
campus-coffee:
  bootstrap-admin:
    login-name: ${BOOTSTRAP_ADMIN_LOGIN_NAME:}
    email-address: ${BOOTSTRAP_ADMIN_EMAIL_ADDRESS:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Bootstrap}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
  consumption:
    grace-period: ${CAMPUS_COFFEE_GRACE_PERIOD:5m}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Connects to PostgreSQL on host port 5433. The default port 5432 could conflict with a PostgreSQL installed on the
    # system or with a container of another project. DB_PORT overrides the host port, as in DB_PORT=5432. Inside the
    # container, PostgreSQL still listens on port 5432.
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/postgres
    username: postgres
    password: postgres
server:
  # Serves the API on port 8081 instead of the default 8080, to avoid a conflict with another app on port 8080.
  # SERVER_PORT overrides the port. The system and acceptance tests run without the dev profile on a random port
  # (WebEnvironment.RANDOM_PORT).
  port: ${SERVER_PORT:8081}
springdoc:
  api-docs:
    enabled: true
    path: /api/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
