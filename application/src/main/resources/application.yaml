spring:
  application:
    name: coffee-kitty
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Keeps the values of the affected row, such as an email address, out of the message of a database error. The
        # message still names the violated constraint.
        logServerErrorDetail: false
  jpa:
    # Turns off Open Session in View, which holds a database connection for the whole request. Without Open Session
    # in View, a lazy association can load only inside a transaction. No JPA entity has a lazy association yet. The
    # read methods of CrudDataServiceImpl and of the data adapters, except getByUserIdForUpdate, are not
    # @Transactional. When the caller has no transaction, these methods map the JPA entity outside any transaction. A
    # data adapter for a JPA entity with a lazy association must therefore read and map the entity inside a
    # @Transactional method.
    open-in-view: false
    hibernate:
      # Flyway creates and migrates the schema. Hibernate checks at startup that the JPA entities match the schema
      # and does not change the schema.
      ddl-auto: validate
    properties:
      # Turns off the logging of SQL errors by Hibernate. The exception handler already logs each database error that a
      # request causes, and Hibernate would log the same error a second time.
      hibernate.jdbc.log.errors: false
  jackson:
    deserialization:
      # Jackson rejects a JSON number with a fraction for an integer field, and the request gets a 400. With the
      # default true, Jackson would truncate a delta of 1.9 to 1, and the request would add a coffee.
      accept-float-as-int: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# Custom properties. The KDoc of a @ConfigurationProperties class documents the keys under its prefix. For
# campus-coffee.fixtures, this class is FixturesProperties. A comment on a key in this file says only why a profile
# sets the value.
campus-coffee:
  fixtures:
    load-on-startup: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Connects to PostgreSQL on host port 5433 instead of the default 5432, to avoid a conflict with a PostgreSQL
    # installed on the system or with a container of another project. DB_PORT overrides the host port, as in
    # DB_PORT=5432. Inside the container, PostgreSQL still listens on port 5432.
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/postgres
    username: postgres
    password: postgres
server:
  # Serves the API on port 8081 instead of the default 8080, to avoid a conflict with another app on port 8080.
  # SERVER_PORT overrides the port. The system and acceptance tests run without the dev profile on a random port
  # (WebEnvironment.RANDOM_PORT).
  port: ${SERVER_PORT:8081}
springdoc:
  api-docs:
    enabled: true
    path: /api/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
campus-coffee:
  fixtures:
    load-on-startup: true
    # Runs a data reset on every start. Each run then begins with only the fixture users at a coffee count of zero.
    reset-on-startup: true
