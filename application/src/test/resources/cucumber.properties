# IntelliJ IDEA runs a single scenario of a feature file with the Cucumber command-line runner instead of CucumberTests,
# and it passes no glue package. The runner reads this file and uses the same glue package as CucumberTests. Without it,
# Cucumber scans every class of the test classpath and calls getDeclaringClass() on each class for its glue hint. That
# call throws IncompatibleClassChangeError for a class that Kotlin generates for an inlined reified call, such as
# returnResult<T>() (see CucumberTests).
cucumber.glue=de.seuhd.campuscoffee.tests.acceptance
cucumber.glue.hint.enabled=false
