# Project coordinates, set on project.group/project.version for every module. The version is the source of
# truth for the version number; the latest CHANGELOG.md release header must match it, enforced by
# scripts/check-version-sync.sh (a CI step).
group=de.seuhd.campuscoffee
version=0.1.0

# TEMPORARY overrides of versions that the Spring Boot BOM manages. io.spring.dependency-management uses a
# project property named like a BOM property in place of the BOM's value, in every module that imports the
# BOM. Delete an override once the pinned Spring Boot manages a version at least as new.
# Spring Boot 4.1.1 brings Tomcat 11.0.24, which carries three critical authentication and authorization
# bypasses in the embedded server (GHSA-9xv2-5v5q-p794, GHSA-gcx9-497g-6cp6, GHSA-h3x4-894j-xpx5).
tomcat.version=11.0.25
# Spring Boot 4.1.1 brings jackson-databind 3.1.5 and 2.21.5, which carry a denial of service when parsing a
# Duration or XMLGregorianCalendar (GHSA-q4xh-88c3-wmh7) and two gaps in the deserialization safeguards
# (GHSA-gx83-3vf8-gh7j, GHSA-wjgm-6hv5-3cvf).
jackson-bom.version=3.1.7
jackson-2-bom.version=2.21.7

# Build subprojects in parallel. Gradle still honors the project dependency graph: domain builds
# first, api and data (which depend only on domain) run in parallel, then application.
org.gradle.parallel=true
# Reuse task outputs across builds when inputs are unchanged.
org.gradle.caching=true
# kapt only needs the annotation processors on its classpath, not the full compile classpath; this
# avoids the "Annotation processors discovery from compile classpath" warning and a redundant scan.
kapt.include.compile.classpath=false
# The Kotlin compiler's jar file system still calls sun.misc.Unsafe.invokeCleaner, a memory-access method
# that JDK 25 warns about per JVM on first use (JEP 498). The call is harmless, so silence the noise. The
# Kotlin daemon covers module compilation; the Gradle daemon covers build-logic compilation and the kapt
# workers. Both daemons run with -Xmx2g, raised from the 512m each ran at by default: the Gradle
# daemon exhausted 512m running the detekt, kapt, and compile work for several modules in parallel during a
# full build (OutOfMemoryError, heap dump), and the Kotlin daemon gets the same headroom for the
# multi-module Kotlin compilation. Setting org.gradle.jvmargs replaces Gradle's default daemon args, so the
# heap-dump flag here restates Gradle's default alongside the unsafe-access flag.
# MaxMetaspaceSize is 768m, raised from Gradle's default of 384m, for the class metadata of every module, kapt,
# and detekt that the Gradle daemon loads.
kotlin.daemon.jvmargs=-Xmx2g --sun-misc-unsafe-memory-access=allow
# --enable-native-access=ALL-UNNAMED silences JDK 25's restricted-native-access warning when build tooling in the
# Gradle daemon loads a native library (e.g., through JNA). Forked test JVMs get both flags through the
# convention plugins' Test jvmArgs, since they do not inherit these daemon args.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED
