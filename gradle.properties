group=de.seuhd.campuscoffee
version=0.3.1

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# External: https://kotlinlang.org/docs/kapt.html kapt needs only the processors of the kapt configuration.
kapt.include.compile.classpath=false
# External: https://openjdk.org/jeps/498 The Kotlin compiler calls sun.misc.Unsafe, which JDK 25 reports.
# ADR-010 The Kotlin daemon takes -Xmx and -XX:MaxMetaspaceSize from org.gradle.jvmargs.
kotlin.daemon.jvmargs=--sun-misc-unsafe-memory-access=allow
# ADR-010 The property replaces the default flags, so it repeats -XX:+HeapDumpOnOutOfMemoryError.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED

# External: https://github.com/advisories/GHSA-m8xf-2cr7-77ph Spring Boot 4.1.2 manages vulnerable Jackson versions.
# Delete both lines when the Spring Boot BOM manages jackson-databind 3.1.8 and 2.21.8 or newer.
jackson-bom.version=3.1.8
jackson-2-bom.version=2.21.8

# External: https://github.com/detekt/detekt/pull/9577 detekt 2.0.0-alpha.6 calls an API that Gradle 9 deprecates.
# Delete the line when a detekt release includes the fix.
org.gradle.warning.mode=none
