# Project coordinates, set on project.group/project.version for every subproject. This version is the single
# source of truth, and scripts/check-version-sync.sh, a CI step, fails when the latest release header in
# CHANGELOG.md names another version.
group=de.seuhd.campuscoffee
version=0.1.0

# Run tasks of different subprojects in parallel. A task still waits for the tasks that it depends on, e.g., api's
# compilation waits for domain's compilation.
org.gradle.parallel=true
# Store task outputs in the local build cache and restore them when the inputs of a task match an earlier run, e.g.,
# after `gradle clean` or a branch switch.
org.gradle.caching=true
# Reuse the configured task graph while the build scripts and their inputs are unchanged. CLAUDE.md (Build and Run
# Commands) states what a build script has to do to stay compatible.
org.gradle.configuration-cache=true
# kapt only needs the annotation processors on its classpath, not the full compile classpath. Leaving the compile
# classpath out avoids the "Annotation processors discovery from compile classpath" warning and a redundant scan.
kapt.include.compile.classpath=false
# The Kotlin daemon compiles the modules and inherits -Xmx and -XX:MaxMetaspaceSize from org.gradle.jvmargs below. This
# line only adds --sun-misc-unsafe-memory-access=allow, which silences JDK 25's warning (JEP 498) about the Kotlin
# compiler's harmless call to sun.misc.Unsafe.invokeCleaner.
kotlin.daemon.jvmargs=--sun-misc-unsafe-memory-access=allow
# The Gradle daemon compiles build-logic and runs the kapt workers and detekt. It ran out of its default 512m in a
# parallel full build (OutOfMemoryError, heap dump), so it gets -Xmx2g, and a MaxMetaspaceSize of 768m instead of the
# default 384m for the class metadata of every module, kapt, and detekt. Setting org.gradle.jvmargs replaces Gradle's
# default daemon args, so this line repeats the default -XX:+HeapDumpOnOutOfMemoryError. The unsafe-access flag is the
# one explained above, and --enable-native-access=ALL-UNNAMED silences JDK 25's restricted-native-access warning when
# build tooling loads a native library (e.g., through JNA). Forked test JVMs get both flags through the convention
# plugins' Test jvmArgs, since they do not inherit these daemon args.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED

# Temporary overrides of versions that the Spring Boot BOM manages. io.spring.dependency-management uses a project
# property named like a BOM property in place of the BOM's value (see java-conventions.gradle.kts). Spring Boot 4.1.2
# brings jackson-databind 3.1.7 and 2.21.7, whose PolymorphicTypeValidator accepts any class named in a generic type
# argument or an array element type of a class-name type ID (GHSA-m8xf-2cr7-77ph, CVE-2026-110879). The patch releases
# 3.1.8 and 2.21.8 fix it. Delete both lines once the spring-boot version in gradle/libs.versions.toml manages 3.1.8
# and 2.21.8 or newer.
jackson-bom.version=3.1.8
jackson-2-bom.version=2.21.8

# detekt 2.0.0-alpha.6 calls Configuration.setVisible, which Gradle 9 deprecates, so every successful build ends with a
# deprecation notice. This setting hides all Gradle deprecation warnings, those of the project's own scripts included.
# Remove it, and bump `detekt` in gradle/libs.versions.toml, once a detekt release includes the fix from
# https://github.com/detekt/detekt/pull/9577. `gradle build --warning-mode all` still shows every deprecation.
org.gradle.warning.mode=none
