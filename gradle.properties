# The group and the version of every project, which Gradle sets as project.group and project.version. The version is
# defined only here. scripts/check-version-sync.sh, which CI runs, fails when the latest release header in CHANGELOG.md
# names a different version.
group=de.seuhd.campuscoffee
version=0.1.0

# Run tasks of different subprojects in parallel. A task still waits for the tasks that it depends on. For example,
# `:api:compileKotlin` waits for `:domain:compileKotlin`.
org.gradle.parallel=true
# Store task outputs in the local build cache. When a task has the same inputs as in an earlier run, for example after
# `gradle clean` or a branch switch, Gradle restores the outputs from the cache instead of running the task.
org.gradle.caching=true
# Reuse the task graph of an earlier run while the build scripts and their inputs are unchanged. CLAUDE.md (Build and
# Run Commands) states what a task action must not use to keep the configuration cache working.
org.gradle.configuration-cache=true
# Stop kapt from also scanning the compile classpath for annotation processors. kapt needs only the processors in the
# `kapt` configuration, and the redundant scan prints the warning "Annotation processors discovery from compile
# classpath".
kapt.include.compile.classpath=false
# JVM flags of the Kotlin daemon, which compiles the modules. The Kotlin daemon takes -Xmx and -XX:MaxMetaspaceSize from
# org.gradle.jvmargs below. The flag --sun-misc-unsafe-memory-access=allow silences the JDK 25 warning (JEP 498) about a
# harmless call of the Kotlin compiler to sun.misc.Unsafe.invokeCleaner.
kotlin.daemon.jvmargs=--sun-misc-unsafe-memory-access=allow
# JVM flags of the Gradle daemon, which compiles build-logic and runs the kapt workers and detekt. With the default heap
# of 512m, a parallel full build failed with an OutOfMemoryError. The daemon therefore gets a heap of 2g (-Xmx2g) and
# 768m instead of the default 384m for the class metadata of every module, kapt, and detekt (-XX:MaxMetaspaceSize).
# These flags replace the default flags of the daemon, and the line repeats the default -XX:+HeapDumpOnOutOfMemoryError
# to keep it. --sun-misc-unsafe-memory-access=allow silences the warning described above.
# --enable-native-access=ALL-UNNAMED silences the JDK 25 warning about restricted native access when build tooling loads
# a native library, for example through JNA. A forked test JVM does not inherit the daemon flags. java-conventions and
# detekt-rules-conventions pass both JDK 25 flags to the test JVM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED

# Temporary overrides of two Jackson versions that the Spring Boot BOM manages. The plugin
# io.spring.dependency-management uses a project property with the name of a BOM property in place of the BOM value (see
# java-conventions.gradle.kts). Spring Boot 4.1.2 manages jackson-databind 3.1.7 and 2.21.7. In these releases, the
# PolymorphicTypeValidator accepts any class that a class-name type ID names as a generic type argument or as an array
# element type (GHSA-m8xf-2cr7-77ph, CVE-2026-110879). The patch releases 3.1.8 and 2.21.8 fix the vulnerability. Delete
# both lines when the spring-boot version in gradle/libs.versions.toml manages 3.1.8 and 2.21.8 or newer.
jackson-bom.version=3.1.8
jackson-2-bom.version=2.21.8

# detekt 2.0.0-alpha.6 calls Configuration.setVisible, which Gradle 9 deprecates. Gradle then ends every successful
# build with a deprecation notice. This setting hides all deprecation warnings, including those about the build scripts
# of this project, and `gradle build --warning-mode all` shows every deprecation warning. When a detekt release includes
# the fix from https://github.com/detekt/detekt/pull/9577, update `detekt` in gradle/libs.versions.toml and delete this
# line.
org.gradle.warning.mode=none
