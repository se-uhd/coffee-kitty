# Version catalog of the Gradle build. A library without a version gets the version from a BOM. The modules import the
# Spring Boot BOM in de.seuhd.campuscoffee.java-conventions, and the detekt-rules tests import junit-bom.
[versions]
# The Java major version. The convention plugins read it for the Java toolchain and the Kotlin jvmTarget. mise.toml pins
# the same major version by hand.
java = "25"
spring-boot = "4.1.2"
junit = "6.1.3"
springdoc = "3.2.0"
mapstruct = "1.6.3"
# kotlin-logging wraps SLF4J for Kotlin. A log call takes a lambda, which builds the message only when the log level is
# enabled. `KotlinLogging.logger {}` names the logger after the enclosing class.
kotlin-logging = "8.0.6"
cucumber = "8.0.4"
archunit = "1.5.1"
# Kotlin 2.3.0 or newer is required for jvmTarget 25. java-conventions sets kotlin-stdlib and kotlin-reflect to this
# version in place of the older Kotlin that the Spring Boot BOM manages. The version can change independently of detekt
# and ktlint, which run on their own compilers (`detekt-kotlin`, `ktlint-kotlin`).
kotlin = "2.4.21"
# Kotlin helpers for Mockito, such as `whenever` and reified versions of `any` and `mock`. The Spring Boot BOM does not
# manage mockito-kotlin.
mockito-kotlin = "6.4.0"
# Gradle plugins
dependency-management = "1.1.7"
# `ktlint-plugin` is the version of the ktlint Gradle plugin by jlleitschuh, and `ktlint-tool` is the version of ktlint
# that the plugin runs.
ktlint-plugin = "14.2.0"
ktlint-tool = "1.8.0"
# The Kotlin compiler that ktlint runs on. ktlint 1.8.0 comes with Kotlin 2.2.21, which prints sun.misc.Unsafe warnings
# on JDK 25. On Kotlin 2.4.21, ktlint fails with "Extensions storage is not registered". On Kotlin 2.4.10, ktlint runs
# without the warnings and without the error.
ktlint-kotlin = "2.4.10"
# The static analysis that `check` runs.
detekt = "2.0.0-alpha.6"
# The Kotlin compiler that detekt runs on. A detekt 2.0 alpha runs only on the Kotlin version that it was built with.
# The convention plugins resolve the Kotlin artifacts of the detekt configurations to this version, independent of the
# `kotlin` entry.
detekt-kotlin = "2.4.10"

[libraries]
# Libraries that a BOM manages, declared without a version
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Spring Boot 4 moved the autoconfiguration of each technology into a separate module. spring-boot-starter-data-jpa does
# not include the module for Flyway.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-tx = { module = "org.springframework:spring-tx" }
# The Spring Boot core without a starter, for the domain. It brings spring-context for @Service and @Component. The
# domain needs neither Bean Validation nor a logging backend.
spring-boot-core = { module = "org.springframework.boot:spring-boot" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# The Kotlin module of Jackson 3 (tools.jackson), which Spring MVC in api needs to bind the DTOs. The Jackson 3 BOM
# manages the version.
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core" }
# Testcontainers 2. The version comes from the testcontainers-bom that the Spring Boot BOM imports.
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

# Libraries with a version: the libraries that no BOM manages, and junit-bom. The detekt-rules tests import junit-bom,
# because detekt-rules does not import the Spring Boot BOM.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
cucumber-spring = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

# Jars of the Gradle plugins that the convention plugins apply by id, for the classpath of build-logic
dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
# Declared only so that Dependabot checks the `ktlint-tool` version, which no other entry references. No module depends
# on ktlint-cli, because the convention plugins pass the `ktlint-tool` version to the ktlint Gradle plugin.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint-tool" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

# Libraries for the custom detekt rules in :detekt-rules. Both libraries use the `detekt` version of the detekt plugin.
# The rules compile against detekt-api. Their unit tests use detekt-test-utils to compile a Kotlin snippet into the
# syntax tree of the Kotlin compiler (PSI). The tests cannot use detekt-test, because the alpha metadata of detekt-test
# requires a variant of detekt-api with test fixtures, which detekt does not publish.
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test-utils = { module = "dev.detekt:detekt-test-utils", version.ref = "detekt" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
# Used only by the root build.gradle.kts, which declares the Kotlin Gradle plugin with `apply false` (see the comment
# there). The version is the `kotlin` entry above.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The ktlint plugin of the root build.gradle.kts and of build-logic/build.gradle.kts. The entry also lets Dependabot
# check the `ktlint-plugin` version on the Gradle Plugin Portal. Dependabot looks up the ktlint-gradle-plugin library
# above only on Maven Central, which does not publish the plugin.
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
