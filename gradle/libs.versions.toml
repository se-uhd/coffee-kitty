# Version catalog for the CampusCoffeeConsumption Gradle build. Entries without a version are managed by
# the Spring Boot BOM (imported in campuscoffee.java-conventions).
[versions]
# Java major version: the single source of truth for the toolchain. The convention plugins resolve
# it for the Gradle toolchain and the Kotlin jvmTarget, and mise.toml pins the same major by hand.
java = "25"
spring-boot = "4.1.1"
junit = "6.1.3"
springdoc = "3.1.1"
mapstruct = "1.6.3"
# kotlin-logging: idiomatic Kotlin logging over SLF4J. Log calls take a lambda (built only when the level
# is enabled) and the logger derives its name from the enclosing class.
kotlin-logging = "8.0.4"
cucumber = "8.0.2"
archunit = "1.5.1"
# Testcontainers is not managed by the Boot 4 BOM at these coordinates, so pin it explicitly.
testcontainers = "1.21.4"
# Kotlin: >= 2.3.0 is required for jvmTarget 25; overrides the Boot 4 BOM's managed Kotlin stdlib.
# Pinned to 2.4.10 to match detekt 2.0.0-alpha.6, which requires the exact Kotlin version it was built against.
kotlin = "2.4.10"
# Kotlin-friendly Mockito wrappers (whenever, reified any/mock); not managed by the Boot BOM.
mockito-kotlin = "6.4.0"
# Gradle plugins
dependency-management = "1.1.7"
# ktlint: the jlleitschuh Gradle plugin and the ktlint engine version it runs.
ktlint-plugin = "12.1.2"
ktlint-tool = "1.5.0"
# detekt static analysis. The 2.0 alpha is pinned to the Kotlin version that it was built against, and `check` runs it.
detekt = "2.0.0-alpha.6"

[libraries]
# BOM-managed (version omitted on purpose)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Boot 4 split autoconfiguration into per-technology modules; Flyway's is not pulled by data-jpa.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
spring-tx = { module = "org.springframework:spring-tx" }
# The Spring Boot core (@ConfigurationProperties, and spring-context for @Service/@Component) without a starter,
# for the domain, which needs neither Bean Validation nor a logging backend. Version managed by the Boot BOM.
spring-boot-core = { module = "org.springframework.boot:spring-boot" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Jackson 3 (tools.jackson) Kotlin module for Spring MVC's DTO binding in api; version from the Jackson 3 BOM.
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
assertj-core = { module = "org.assertj:assertj-core" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

# Explicitly versioned (not in the BOMs)
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
cucumber-spring = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

# Plugin artifacts build-logic depends on so the convention plugins can apply them by id
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

# detekt rule-authoring API: detekt-api compiles the custom rules in :detekt-rules, detekt-test-utils
# compiles Kotlin snippets to PSI for their unit tests. Same version as the detekt plugin. (We use
# detekt-test-utils rather than detekt-test because the latter's alpha metadata requires a detekt-api
# test-fixtures variant that is not published.)
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test-utils = { module = "dev.detekt:detekt-test-utils", version.ref = "detekt" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
# Declared only to be applied (with `apply false`) once at the root, so the Kotlin Gradle plugin is loaded by
# a single classloader for every subproject's convention plugins. The version tracks the `kotlin` entry above.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
