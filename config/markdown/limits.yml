# The limits of the Markdown files (doc/adr/013-limits-for-text.md). The task markdownLimits fails for a Markdown file
# that no entry lists. The first entry that matches a file applies. Each entry names the source of its limits, which
# the message of a violation repeats.
lineLength: 120
files:
  - path: CLAUDE.md
    maxLines: 200
    includeUnscopedRules: true
    source: "Claude Code memory docs: target under 200 lines per CLAUDE.md file"
  - glob: ".claude/rules/*.md"
    maxLines: 100
    source: "decision of 2026-11-26 in ADR 013"
  - glob: ".claude/skills/*/SKILL.md"
    maxLines: 500
    source: "Anthropic, skill authoring best practices: keep SKILL.md under 500 lines"
  - path: AGENTS.md
    maxLines: 20
    source: "AGENTS.md points to CLAUDE.md and lists the rule files that gradle ruleIndex generates"
  - path: README.md
    maxLines: 200
    maxSectionLines: 60
    source: "decision of 2026-11-26 in ADR 013"
  - path: CHANGELOG.md
    changelog: true
    maxBulletLines: 2
    source: "Keep a Changelog 1.1.0 and the decision of 2026-11-26 in ADR 013"
  - path: GLOSSARY.md
    maxLines: 200
    source: "decision of 2026-11-26 in ADR 013"
  - path: models/README.md
    maxLines: 80
    source: "decision of 2026-11-26 in ADR 013"
  - path: doc/adr/010-thresholds-of-the-build.md
    adr:
      template: doc/adr/template.md
      minOptions: 2
      maxOptions: 5
    source: "ADR 013 and ADR 016: the record of the measurements of the build has only the structure of the template"
  - glob: "doc/adr/[0-9][0-9][0-9]-*.md"
    maxLines: 100
    adr:
      template: doc/adr/template.md
      minOptions: 2
      maxOptions: 5
      maxSectionLines:
        Context: 12
        Decision(s): 30
        Consequences: 15
    source: "Michael Nygard, Documenting Architecture Decisions: one or two pages; ADR 016 for the sections"
  - path: doc/adr/template.md
    maxLines: 100
    source: "Michael Nygard, Documenting Architecture Decisions: one or two pages"
  - glob: "requirements/FR-*.md"
    maxLines: 110
    source: "ADR 013: the longest requirement whose meaning a review confirmed, FR-6 with 101 lines, rounded up"
