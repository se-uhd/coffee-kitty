# Dependabot keeps the GitHub Actions and the Gradle (Kotlin/Java) dependencies current. Most versions are in
# the gradle/libs.versions.toml catalog, which the gradle ecosystem updates (BOM-managed dependencies without an
# explicit version follow the Spring Boot BOM and are not updated here).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Dependabot proposes a release only 7 days after it is published (`cooldown` in each block). A hijacked release,
# published from a maintainer's stolen account, is usually withdrawn within days, and a reviewer cannot tell it from
# a genuine one by its version bump. Students build this project on their own machines, where such a release would
# run. Security updates are not delayed.
version: 2
updates:
  # The actions in .github/workflows/. Every action is pinned to a full commit SHA with its release in a `# vX.Y.Z`
  # comment at the end of the line, which Dependabot updates together with the SHA. One pull request bundles the
  # updates of all actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Gradle dependencies and plugins, resolved from the version catalog (covers the root build and
  # the build-logic convention plugins, which reference the same catalog).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # One pull request bundles the minor and patch updates, and each major update gets its own pull request, so that
      # it gets a careful review.
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
