# Dependabot keeps the GitHub Actions and the Gradle (Kotlin/Java) dependencies current. Most versions are in
# the gradle/libs.versions.toml catalog, which the gradle ecosystem updates (BOM-managed dependencies without an
# explicit version follow the Spring Boot BOM and are not bumped here).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Workflow actions in .github/workflows/ (i.e., actions/checkout, actions/upload-artifact, and
  # jdx/mise-action). Every action is pinned to a full commit SHA with its release in a `# vX.Y.Z` comment at the
  # end of the line, which Dependabot updates together with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Gradle dependencies and plugins, resolved from the version catalog (covers the root build and
  # the build-logic convention plugins, which reference the same catalog).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
