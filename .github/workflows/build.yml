name: Build Coffee Kitty

# For a pull request, the workflow builds the merge of the pull request branch into the base branch. The
# `pull_request` trigger has no branch filter, and the workflow also builds pull requests into branches other than
# main. The `push` trigger builds changes that reach main without a pull request.
on:
  push:
    branches: [ "main" ]
  pull_request:

# The build runs third-party Gradle plugins and annotation processors. A read-only token prevents a compromised
# dependency from changing the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes back to the repository

      # Install the Java and Gradle versions that mise.toml pins.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # Fail before the build when the version in gradle.properties differs from the latest release in CHANGELOG.md.
      - name: Check version is in sync with the changelog
        run: ./scripts/check-version-sync.sh

      # `gradle build` runs `check`, which runs ktlint, detekt, and the tests. The integration, system, and acceptance
      # tests start PostgreSQL in Docker through Testcontainers. The ubuntu-latest runner has Docker installed.
      - name: Build with Gradle
        run: gradle build

      # Keep the test reports of a failed build for inspection.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            application/build/reports/cucumber/
          if-no-files-found: warn
