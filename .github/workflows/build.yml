name: Build Coffee Kitty

# A pull request builds the merge of its branch into its base branch, and a push to main builds a change that
# reaches main without a pull request. The pull-request trigger has no branch filter, so a pull request that
# targets a branch other than main is built as well.
on:
  push:
    branches: [ "main" ]
  pull_request:

# The build executes third-party Gradle plugins and annotation processors, so the token is read-only and a
# compromised dependency cannot push or modify the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes back to the repository

      # Installs Java 25 and Gradle as mise.toml pins them.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # Fail fast if the Gradle build version drifts from the latest CHANGELOG.md version.
      - name: Check version is in sync with the changelog
        run: ./scripts/check-version-sync.sh

      # `gradle build` runs `check`: ktlint, detekt, and the tests. The integration, system, and acceptance
      # tests start PostgreSQL in Docker through Testcontainers, and the runner provides Docker.
      - name: Build with Gradle
        run: gradle build

      # Keep the test reports of a failed build for inspection.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            application/build/reports/cucumber/
          if-no-files-found: warn
