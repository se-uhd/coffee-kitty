name: Build Coffee Kitty

# For a pull request, the workflow builds the merge of the pull request branch into the base branch. The `pull_request`
# trigger has no branch filter, so the workflow also builds pull requests into branches other than main. The `push`
# trigger builds changes that reach main without a pull request.
on:
  push:
    branches: [ "main" ]
  pull_request:

# The build runs third-party Gradle plugins and annotation processors. A read-only token prevents a compromised
# dependency from changing the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes back to the repository
          fetch-depth: 0 # the check of the commit messages reads the commits since the base branch

      # Fail when a commit message breaks the format of doc/adr/013-limits-for-text.md. A pull request checks its
      # commits; a push to main checks the pushed commits, or every commit when the old head is unknown after a rewrite.
      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          scripts/test-check-commit-message.sh
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then range="$BASE..HEAD"; else range=HEAD; fi
          scripts/check-commit-message.sh --range "$range"

      # Install the versions of Java, Gradle, and TLC that mise.toml pins.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      # Fail before the build when the version in gradle.properties differs from the latest release in CHANGELOG.md.
      - name: Check version is in sync with the changelog
        run: ./scripts/check-version-sync.sh

      # `gradle build` runs `check`, which runs ktlint, detekt, CPD, the tests, and the coverage gate. The integration,
      # system, and acceptance tests start PostgreSQL in Docker through Testcontainers. The ubuntu-latest runner has
      # Docker installed.
      # The models of the domain are optional (ADR-012), so CI checks them only in se-uhd/coffee-kitty and not in a fork,
      # such as the fork of a student.
      - name: Build with Gradle
        run: gradle build ${{ github.repository == 'se-uhd/coffee-kitty' && '-Pmodels' || '' }}

      # `gradle build` does not run the mutation tests. PIT changes the code of the domain services and fails when the
      # unit tests of the domain module detect fewer than 90% of the changes (pitest-conventions.gradle.kts).
      - name: Run the mutation tests of the domain module
        run: gradle :domain:pitest

      # Upload the test reports of a failed build, so that a developer can inspect them.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            application/build/reports/cucumber/
            domain/build/reports/pitest/
          if-no-files-found: warn
